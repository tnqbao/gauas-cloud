apiVersion: v1
kind: Secret
metadata:
  name: gauas-secret
  namespace: gauas-cloud-stack
type: Opaque
stringData:
  # PostgreSQL
  PGPOOL_USER: "gauas_user"
  PGPOOL_PASSWORD: "gauas_password_change_in_production"

  # Redis
  REDIS_PASSWORD: "redis_password_change_in_production"

  # MinIO
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123_change_in_production"

  # RabbitMQ
  RABBITMQ_USER: "gauas_rabbitmq"
  RABBITMQ_PASSWORD: "rabbitmq_password_change_in_production"

  # JWT & Auth
  JWT_SECRET_KEY: "your_jwt_secret_key_change_this_in_production"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE: "604800"
  PRIVATE_KEY: "your_private_key_for_authorization_change_in_production"

