---
# Nginx Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: gauas-cloud-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-gateway-config

---
# Nginx Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-service
  namespace: gauas-cloud-stack
spec:
  selector:
    app: nginx-gateway
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer

