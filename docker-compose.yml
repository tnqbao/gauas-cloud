version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: gauas-postgres
    restart: unless-stopped
    ports:
      - "${PGPOOL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PGPOOL_USER}
      POSTGRES_PASSWORD: ${PGPOOL_PASSWORD}
      POSTGRES_DB: ${PGPOOL_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGPOOL_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gauas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: gauas-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gauas-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Services
  gau-authorization-service:
    build:
      context: ./backend/gau-authorization-service
      dockerfile: Dockerfile
    container_name: gau-authorization-service
    restart: unless-stopped
    ports:
      - "${AUTHORIZATION_SERVICE_PORT:-8081}:8080"
    env_file:
      - example.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gau-cdn-service:
    build:
      context: ./backend/gau-cdn-service
      dockerfile: Dockerfile
    container_name: gau-cdn-service
    restart: unless-stopped
    ports:
      - "${CDN_SERVICE_PORT:-8082}:8080"
    env_file:
      - example.env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gau-cloud-service:
    build:
      context: ./backend/gau-cloud-service
      dockerfile: Dockerfile
    container_name: gau-cloud-service
    restart: unless-stopped
    ports:
      - "${CLOUD_SERVICE_PORT:-8083}:8080"
    env_file:
      - example.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gau-upload-service:
    build:
      context: ./backend/gau-upload-service
      dockerfile: Dockerfile
    container_name: gau-upload-service
    restart: unless-stopped
    ports:
      - "${UPLOAD_SERVICE_PORT:-8084}:8080"
    env_file:
      - example.env
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  gau-cloud-console:
    build:
      context: ./frontend/gau-cloud-console
      dockerfile: Dockerfile
    container_name: gau-cloud-console
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - example.env
    depends_on:
      - gau-authorization-service
      - gau-cdn-service
      - gau-cloud-service
      - gau-upload-service
    networks:
      - gauas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  gauas-network:
    driver: bridge

